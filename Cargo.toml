[workspace]
members = ["primitives", "script", "program"]
resolver = "2"

[workspace.dependencies]

# General
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "^1.38.0", features = ["full"] }
dotenv = "0.15.0"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_cbor = "0.11.2"
subtle-encoding = "0.5.1"
anyhow = "1.0.82"
clap = { version = "4.0", features = ["derive", "env"] }
log = "0.4.21"
futures = "0.3.30"
env_logger = "0.11.3"
serde_json = "1"
chrono = "0.4.38"
csv = "1.3.1"
sha2 = "0.10"

# SP1
sp1-sdk = "4.0.1"
sp1-zkvm = "4.0.1"

# Tendermint
tendermint = { version = "0.40.0", default-features = false }
tendermint-light-client          = { version = "0.40.0", features = ["rpc-client"] }
tendermint-light-client-verifier = { version = "0.40.0", default-features = false, features = ["rust-crypto"] }
tendermint-rpc = { version = "0.40.0", features = ["http-client"]}

# Ethereum
alloy = { version = "0.7.0", default-features = false, features = ["full"] }
hex = "0.4.3"

